[package]
name = "keycloak-oauth2"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "OAuth2/OIDC Authorization Code + PKCE para Keycloak: login no navegador, callback loopback, refresh, logout e descoberta OIDC."
readme = "README.md"
keywords = ["keycloak", "oauth2", "oidc", "pkce", "authentication"]
categories = ["authentication", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
form_urlencoded = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
open = "5"
log = "0.4"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
url = "2"
